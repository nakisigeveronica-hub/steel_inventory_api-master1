name: steel_inventory_api
description: "Steel inventory management app"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: "^3.11.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  flutter_onboarding: ^2.0.0
  crypto: ^3.0.7
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  bcrypt: ^1.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  mobile_scanner: ^7.5.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  # pdf 3.12 limits archive to <4.1; image 4.11 uses newer archive APIs.
  image: 4.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
